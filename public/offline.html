<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne | Le Pacha Restaurant</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
        background: #faf6ee;
        color: #32190c;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
      }
      .badge {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 9999px;
        background: #32190c;
        border: 3px solid #d2ab5f;
        display: grid;
        place-items: center;
        font-size: 1.75rem;
        font-weight: 700;
        color: #d2ab5f;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.9rem;
        color: #6b5a4d;
        margin: 0 0 1.5rem;
      }
      button {
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        color: #faf6ee;
        background: #32190c;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">P</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Impossible de charger cette page sans connexion internet. Vérifiez votre réseau puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
