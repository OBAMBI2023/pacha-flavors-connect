<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne | SAOVIA Food</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
        background: #faf6ee;
        color: #32190c;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
      }
      .badge {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 9999px;
        background: #32190c;
        border: 3px solid #d2ab5f;
        display: grid;
        place-items: center;
        font-size: 1.75rem;
        font-weight: 700;
        color: #d2ab5f;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.9rem;
        color: #6b5a4d;
        margin: 0 0 1.5rem;
      }
      button {
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        color: #faf6ee;
        background: #32190c;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">S</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Impossible de charger cette page sans connexion internet. Vérifiez votre réseau puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());

      // Self-heal: this page must only ever appear when there is genuinely
      // no network. If the browser disagrees (or a real request actually
      // succeeds), an old/broken service worker is almost certainly
      // intercepting navigation and serving this fallback unconditionally --
      // a fixed worker no longer does that (see scripts/generate-sw.mjs), but
      // a visitor stuck on an already-installed broken one can never reach
      // the real app to pick up that fix on its own, since this static page
      // -- not the React app -- is the only thing that ever actually loads
      // for them. Unregistering + clearing every cache here lets the very
      // next load fetch the current, fixed worker instead, with no DevTools
      // or manual "clear site data" step required from the visitor.
      (async () => {
        if (!navigator.onLine) return;
        try {
          const probe = await fetch("/manifest.webmanifest", { cache: "no-store", method: "HEAD" });
          if (!probe.ok) return;
        } catch {
          return; // genuinely offline (or a transient network error) -- let the visitor retry manually.
        }
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((r) => r.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        location.reload();
      })();
    </script>
  </body>
</html>
